name: Collect Best Cloudflare IPv4

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collector Script
        run: |
          python .github/scripts/best-cf-ipv4-collector.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add best-cf-ipv4.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto Update: Best 30 US Cloudflare IPv4 [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
