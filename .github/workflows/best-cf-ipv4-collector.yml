name: Collect Best Cloudflare IPv4

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次
  workflow_dispatch:      # 支持手动一键运行

concurrency:
  group: cf-ips-collector
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collector Script
        run: |
          python .github/scripts/best-cf-ipv4-collector.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add best-cf-ipv4.txt
          
          if git diff --staged --quiet; then
            echo "✅ 节点列表无变更，无需重复提交。"
          else
            git commit -m "Auto Update: Best 30 US Cloudflare IPv4 [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
