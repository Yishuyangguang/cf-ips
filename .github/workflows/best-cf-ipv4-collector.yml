name: Collect Best Cloudflare IPv4

on:
  schedule:
    - cron: '0 0 * * *' # 每天运行一次（24 小时周期）
  workflow_dispatch:      # 依然保留手动一键运行按钮

concurrency:
  group: cf-ips-collector
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collector Script
        run: |
          python .github/scripts/best-cf-ipv4-collector.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add best-cf-ipv4.txt
          
          if git diff --staged --quiet; then
            echo "✅ 节点列表无变化，无需重复提交。"
          else
            git commit -m "Auto Update: Best 30 US Cloudflare IPv4 [skip ci]"
            git pull --rebase origin HEAD || true
            git push origin HEAD
          fi
